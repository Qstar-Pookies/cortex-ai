<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16171a" />
  <meta name="description" content="Cortex AI — a calmer, faster place to think out loud. Ask anything, think deeper, build faster." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cortex AI — Think out loud" />
  <meta property="og:description" content="A calmer, faster place to think out loud. Ask anything, think deeper, build faster." />
  <title>Cortex AI — Think out loud</title>

  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="apple-touch-icon" href="assets/logo.svg" />
  <script src="js/theme.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css?v=5" />
  <link rel="stylesheet" href="css/style.css?v=5" />
  <link rel="stylesheet" href="css/animations.css?v=5" />
</head>
<body>

    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></symbol>

    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-6A3.5 3.5 0 0 0 3 6.5v6A2.5 2.5 0 0 0 5.5 15"/></symbol>

    <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></symbol>

    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4l6 2 5-2v14l-5 2-6-2-5 2V6l5-2z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 12a7.5 7.5 0 0 1-10.9 6.7L4 20l1.3-5.1A7.5 7.5 0 1 1 20 12z"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M4 8l4 3 4-6 4 6 4-3-2 10H6L4 8z"/><path d="M6 21h12"/></symbol>
  </svg>

  <div class="app" id="app">
    <!-- ───────────────────────── sidebar ───────────────────────── -->
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar__head">
        <a class="brand" href="#">
          <span class="brand__mark" aria-hidden="true"><img class="brand__logo" src="assets/logo.svg" alt=""></span>
          <span class="brand__name">Cortex<em>AI</em></span>
          <span class="sr-only"> home</span>
        </a>
        <button class="icon-btn icon-btn--sm sidebar__collapse" id="sidebarClose" type="button" aria-label="Close sidebar">
          <svg class="ic"><use href="#i-panel"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChatBtn" type="button">
        <svg class="ic"><use href="#i-plus"/></svg>
        <span>New chat</span>
        <kbd class="new-chat__kbd">⌘⇧O</kbd>
      </button>

      <label class="side-search" for="historySearch">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="historySearch" type="search" placeholder="Search chats" autocomplete="off" />
      </label>

      <nav class="history" id="history" aria-label="Conversations"></nav>
    </aside>

    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <!-- ───────────────────────── main ───────────────────────── -->
    <main class="main">
      <header class="topbar">
        <span class="topbar__title" id="chatTitle" aria-live="polite"></span>
      </header>

      <section class="stage is-empty" id="stage">
        <div class="scroll" id="scroll">
          <!-- empty state -->
          <div class="hero" id="hero">
            <h1 class="hero__title">Hi, I'm <span class="accent">Cortex</span>.</h1>
            <p class="hero__sub" id="heroSub"></p>
          </div>

          <!-- conversation -->
          <div class="thread" id="thread" role="log" aria-live="polite"></div>
        </div>

        <div class="dock">
          <form class="composer" id="composer" autocomplete="off">
            <div class="composer__inner">
              <label class="sr-only" for="prompt">Message Cortex</label>
              <textarea id="prompt" rows="1" placeholder="Message Cortex…" spellcheck="true" enterkeyhint="send"></textarea>
              <div class="composer__files" id="composerFiles" aria-live="polite"></div>
              <div class="composer__bar">
                <div class="composer__tools">
                  <input type="file" id="fileInput" hidden />
                  <button class="tool-btn tool-btn--attach" id="attachBtn" type="button" aria-label="Attach a file" title="Attach a file">
                    <svg class="ic"><use href="#i-clip"/></svg>
                  </button>
                </div>
                <div class="composer__send">
                  <span class="composer__hint" id="composerHint">Enter to send</span>
                  <button class="send" id="sendBtn" type="submit" aria-label="Send message" disabled>
                    <svg class="ic send__arrow"><use href="#i-arrow-up"/></svg>
                    <svg class="ic send__stop" hidden><use href="#i-stop"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- command palette -->
  <div class="palette" id="palette" hidden>
    <div class="palette__card" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette__input">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="paletteInput" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <div class="palette__list" id="paletteList" role="listbox"></div>
      <div class="palette__foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">Cortex needs JavaScript for the chat demo. Enable it and refresh.</div>
  </noscript>

  <script src="js/chat.js?v=5" defer></script>
  <script src="js/app.js?v=5" defer></script>
</body>
</html>
